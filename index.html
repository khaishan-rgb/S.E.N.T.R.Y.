<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SG Transport Pulse V3.1</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a10;color:#e9f8ff;font-family:Inter,system-ui,Arial}header{height:56px;display:flex;align-items:center;padding:0 15px;background:#07111b;border-bottom:1px solid #173344}.logo{font-weight:900;letter-spacing:1.5px}.live{margin-left:auto;color:#48efa0;font-size:11px}.shell{display:grid;grid-template-columns:300px 1fr 330px;height:calc(100vh - 56px)}.panel{background:#07111b;padding:14px;overflow:auto;border-right:1px solid #173344}.right{border-left:1px solid #173344;border-right:0}.k{font-size:10px;letter-spacing:1.5px;color:#78a0b3;text-transform:uppercase}.title{font-size:20px;font-weight:850;margin:4px 0 12px}.search{display:grid;gap:8px}.search input,.search select,.search button{width:100%;padding:11px;border-radius:9px;border:1px solid #1b4960;background:#081722;color:#fff;font-size:14px}.search button{background:#24c8ed;color:#00131a;font-weight:900}.clear{background:#0a1b27!important;color:#a8d6e8!important}.card{border:1px solid #173b50;border-radius:12px;padding:12px;margin:10px 0;background:#081722}.metric{font-size:26px;font-weight:900;color:#52d9ff}.muted{color:#82a1b1;font-size:12px}.busrow{padding:9px 0;border-bottom:1px solid #143041}.eta{font-size:20px;font-weight:900}.mapwrap{position:relative}#map{height:100%;width:100%}.scope{position:absolute;z-index:800;top:12px;left:50%;transform:translateX(-50%);background:#07111be8;border:1px solid #1c526b;border-radius:10px;padding:8px 11px;font-size:11px;max-width:80%;text-align:center}.legend{position:absolute;z-index:800;bottom:20px;left:12px;background:#07111bea;border:1px solid #1c526b;border-radius:10px;padding:9px;font-size:11px}.dot{display:inline-block;width:19px;height:5px;border-radius:3px;margin-right:5px}.dirrow{display:flex;gap:7px}.dirbtn{flex:1;padding:9px;border:1px solid #1c526b;border-radius:8px;background:#0a1b27;color:#a9d5e5}.dirbtn.on{background:#17475b;color:#fff}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#081722;color:#fff}
@media(max-width:800px){.shell{display:block;height:auto}.panel{border:0}.mapwrap{height:58vh}.right{border:0}.scope{max-width:92%}.legend{bottom:10px}.title{font-size:18px}}
</style></head><body>
<header><div class="logo">SG TRANSPORT // PULSE <span style="color:#4bdcff">V4</span></div><div class="live">● LIVE</div></header>
<div class="shell"><aside class="panel"><div class="k">Operations Search</div><div class="title">Service focus</div>
<div class="search"><input id="svc" placeholder="Service e.g. 197"><input id="stop" placeholder="Bus stop (optional) e.g. 10009">
<div class="dirrow"><button id="d1" class="dirbtn on" onclick="setDir(1)">Direction 1</button><button id="d2" class="dirbtn" onclick="setDir(2)">Direction 2</button></div>
<button onclick="apply()">SEARCH / FILTER</button><button class="clear" onclick="clearAll()">CLEAR</button></div>
<div id="routeInfo"></div></aside>
<main class="mapwrap"><div id="map"></div><div class="scope" id="scope">SINGAPORE NETWORK • Select a service</div>
<div class="legend"><b>LIVE TRAFFIC</b><br><span class="dot" style="background:#29d66f"></span>Smooth<br><span class="dot" style="background:#ffc642"></span>Moderate<br><span class="dot" style="background:#ff435f"></span>Slow / bad<br><span class="dot" style="background:#3bdcff"></span>No traffic data</div></main>
<aside class="panel right"><div class="k">Operational Intelligence</div><div class="title" id="focusTitle">Network overview</div><div id="intel"></div><div class="k">Visible buses / arrivals</div><div id="arrivals"></div></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([1.3521,103.8198],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let layer=L.layerGroup().addTo(map),dir=1;const $=x=>document.getElementById(x);
function setDir(d){dir=d;$('d1').classList.toggle('on',d===1);$('d2').classList.toggle('on',d===2);if($('svc').value.trim())apply()}
function m(t){if(!t)return null;return Math.max(0,Math.round((new Date(t)-new Date())/60000))}
function bandColor(b){b=Number(b);if(b<=2)return '#ff435f';if(b<=4)return '#ffc642';return '#29d66f'}
function busIcon(s){return L.divIcon({className:'',iconSize:[36,28],iconAnchor:[18,14],html:`<div style="background:#15c9f0;color:#00141b;border:2px solid white;border-radius:8px;padding:4px 6px;font-weight:950;text-align:center;box-shadow:0 0 13px #16c9ef">${s}</div>`})}
async function get(u){let r=await fetch(u);return r.json()}
async function apply(){let s=$('svc').value.trim(),st=$('stop').value.trim();if(!s&&!st)return;layer.clearLayers();$('scope').textContent=`${s?'SERVICE '+s:'BUS STOP'} • DIRECTION ${dir}${st?' • STOP '+st:''} • LIVE`;$('focusTitle').textContent=s?`Service ${s} • Dir ${dir}`:`Stop ${st}`;$('intel').innerHTML='<div class="card">Loading live data…</div>';let d=await get(`/api/context?service=${encodeURIComponent(s)}&stop=${encodeURIComponent(st)}&direction=${dir}`);render(d)}
function render(d){let bounds=[],r=d.route||[];
 if(r.length){
   let ll=r.map(x=>[Number(x.lat),Number(x.lon)]);bounds.push(...ll);
   const bands=d.speedBands||[];
   function km(a,b){let R=6371,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180,q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
   function nearestBand(a,b){let mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],best=null,bd=9e9;for(const x of bands){let xm=[(Number(x.a[0])+Number(x.b[0]))/2,(Number(x.a[1])+Number(x.b[1]))/2],dd=km(mid,xm);if(dd<bd){bd=dd;best=x}}return bd<=0.55?best:null}
   for(let i=0;i<ll.length-1;i++){let tb=nearestBand(ll[i],ll[i+1]);let c=tb?bandColor(tb.band):'#39c7e8';L.polyline([ll[i],ll[i+1]],{color:c,weight:8,opacity:.95,lineCap:'round'}).bindPopup(tb?`<b>${tb.road||'Traffic segment'}</b><br>${tb.min??''}-${tb.max??''} km/h • LTA Band ${tb.band}`:'Traffic data unavailable for this route section').addTo(layer)}
   r.forEach((x,i)=>{L.circleMarker([x.lat,x.lon],{radius:3,color:'#fff',weight:2,fillColor:'#06131d',fillOpacity:1}).bindPopup(`<b>${x.code}</b><br>${x.name||''}<br><button onclick="selectStop('${x.code}')" style="margin-top:6px">Monitor this stop</button>`).addTo(layer)})
 }
 (d.incidents||[]).forEach(x=>{if(x.Latitude&&x.Longitude)L.circleMarker([x.Latitude,x.Longitude],{radius:6,color:'#ff3657',fillColor:'#ff3657',fillOpacity:.9}).bindPopup(`<b>${x.Type||'Incident'}</b><br>${x.Message||''}`).addTo(layer)});
 let ah='',busCount=0;(d.arrivals||[]).forEach(s=>{let bs=[s.NextBus,s.NextBus2,s.NextBus3].filter(Boolean);ah+=`<div class="card"><b>Service ${s.ServiceNo}</b>`;bs.forEach(b=>{let eta=m(b.EstimatedArrival),lat=Number(b.Latitude),lon=Number(b.Longitude);ah+=`<div class="busrow"><span class="eta">${eta===null?'--':eta+' min'}</span> <span class="muted">${b.Load||''} ${b.Type||''}</span></div>`;if(lat&&lon){L.marker([lat,lon],{icon:busIcon(s.ServiceNo)}).bindPopup(`<b>BUS • ${s.ServiceNo}</b><br>ETA ${eta} min<br>${b.Load||''}`).addTo(layer);bounds.push([lat,lon]);busCount++}});ah+='</div>'});
 $('arrivals').innerHTML=ah||'<div class="card muted">To show actual approaching bus locations, enter a bus stop on this route. LTA Bus Arrival provides estimated locations for buses approaching the queried stop.</div>';
 let sb=d.speedBands||[],red=sb.filter(x=>Number(x.band)<=2).length,yel=sb.filter(x=>Number(x.band)>=3&&Number(x.band)<=4).length,green=sb.filter(x=>Number(x.band)>=5).length;
 let dbg=d.trafficDebug||{};let feedOK=(dbg.rawSegments||0)>0;
 $('intel').innerHTML=`<div class="card"><div class="k">Selected direction</div><div class="metric">${r.length} stops</div><div class="muted">Direction ${d.direction} only — opposite direction hidden.</div></div><div class="card"><div class="k">Live LTA Traffic • 5-min feed</div><div style="margin-top:8px">🟢 ${green} smooth &nbsp; 🟡 ${yel} moderate &nbsp; 🔴 ${red} slow</div><div class="muted" style="margin-top:7px">${dbg.matchedSegments||0} traffic segments matched • ${dbg.rawSegments||0} received from LTA.<br>${dbg.endpoint?'Feed: '+dbg.endpoint:''}<br><b>The route line itself is traffic-coloured.</b></div><div style="margin-top:8px;font-size:12px;color:${feedOK?'#48efa0':'#ff5571'}">${feedOK?'● TRAFFIC FEED CONNECTED':'● TRAFFIC FEED ERROR'+(dbg.error?' — '+dbg.error:'')}</div></div><div class="card"><div class="k">Other live signals</div><div class="muted">${(d.incidents||[]).length} nearby incident(s) • ${busCount} bus location(s) visible</div></div>`;
 $('routeInfo').innerHTML=`<div class="card"><div class="k">Direction ${d.direction}</div><div class="metric">${r.length}</div><div class="muted">stops • only one direction shown</div></div>`;
 if(bounds.length)map.fitBounds(bounds,{padding:[25,25],maxZoom:14});else if(r.length)map.fitBounds(r.map(x=>[x.lat,x.lon]),{padding:[25,25],maxZoom:14})
}
function selectStop(code){$('stop').value=code;apply()}
function clearAll(){$('svc').value='';$('stop').value='';layer.clearLayers();map.setView([1.3521,103.8198],11);$('scope').textContent='SINGAPORE NETWORK • Select a service';$('intel').innerHTML='';$('arrivals').innerHTML='';$('routeInfo').innerHTML=''}
setTimeout(()=>map.invalidateSize(),300);
</script></body></html>
