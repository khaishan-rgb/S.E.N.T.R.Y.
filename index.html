<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SG Transport Pulse</title><style>
body{margin:0;background:#050a10;color:#d9f7ff;font:14px system-ui}header{padding:20px 5%;border-bottom:1px solid #18384b;font-weight:800;letter-spacing:.18em}
main{max-width:1300px;margin:auto;padding:25px}.hero,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.p{background:#09141e;border:1px solid #17364a;border-radius:18px;padding:20px}.cards{grid-template-columns:repeat(5,1fr);margin-top:16px}.n{font-size:34px;font-weight:800;color:#54dcff}.muted{color:#7899aa}.ring{font-size:72px;font-weight:900}.state{letter-spacing:.15em;color:#55efa0}
input{background:#04090e;border:1px solid #23516a;color:white;padding:12px;border-radius:10px;margin:4px}button{padding:12px 20px;border:0;border-radius:10px;background:#54dcff;font-weight:800}
.row{padding:12px 0;border-bottom:1px solid #163044}pre{white-space:pre-wrap;max-height:280px;overflow:auto;color:#9dcddd}
@media(max-width:800px){.hero,.cards{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header>SG TRANSPORT // PULSE <span class="state">● LIVE</span></header><main>
<div class="hero"><section class="p"><div class="muted">SINGAPORE NETWORK HEALTH</div><div class="ring" id="score">--</div><div class="state" id="state">CONNECTING</div><p class="muted" id="updated"></p></section>
<section class="p"><div class="muted">LIVE BUS RADAR</div><p><input id="stop" placeholder="Bus stop code"><input id="svc" placeholder="Service"><button onclick="scan()">SCAN</button></p><div id="bus">Enter a stop code.</div></section></div>
<div class="cards"><div class="p"><div class="n" id="inc">--</div><span>Incidents</span></div><div class="p"><div class="n" id="rw">--</div><span>Road works</span></div><div class="p"><div class="n" id="fl">--</div><span>Faulty lights</span></div><div class="p"><div class="n" id="fd">--</div><span>Flood alerts</span></div><div class="p"><div class="n" id="vm">--</div><span>VMS</span></div></div>
<div class="hero" style="margin-top:16px"><section class="p"><div class="muted">LIVE INCIDENT INTELLIGENCE</div><pre id="raw">Loading…</pre></section><section class="p"><div class="muted">SYSTEM</div><pre id="health">Loading…</pre></section></div>
</main><script>
const g=x=>document.getElementById(x),J=async u=>{let r=await fetch(u);return await r.json()};
async function refresh(){try{let d=await J('/api/pulse');g('score').textContent=d.score;g('state').textContent=d.state;g('updated').textContent='Updated '+new Date(d.time*1000).toLocaleTimeString();g('inc').textContent=d.feeds.incidents.count;g('rw').textContent=d.feeds.roadworks.count;g('fl').textContent=d.feeds.lights.count;g('fd').textContent=d.feeds.floods.count;g('vm').textContent=d.feeds.vms.count;g('raw').textContent=JSON.stringify(d.feeds.incidents.data,null,2);g('health').textContent=JSON.stringify(await J('/api/health'),null,2)}catch(e){g('updated').textContent=e}}
async function scan(){let s=g('stop').value.trim(),v=g('svc').value.trim();if(!s)return;g('bus').textContent='Scanning…';try{let d=await J('/api/bus?stop='+encodeURIComponent(s)+(v?'&service='+encodeURIComponent(v):''));let a=d.Services||[];g('bus').innerHTML=a.length?a.map(x=>{let b=[x.NextBus,x.NextBus2,x.NextBus3].filter(Boolean),e=b.map(y=>y.EstimatedArrival?Math.max(0,Math.round((new Date(y.EstimatedArrival)-Date.now())/60000))+'m':'—').join(' · ');return '<div class=row><b>'+x.ServiceNo+'</b> &nbsp; '+e+'</div>'}).join(''):'No live arrivals returned.'}catch(e){g('bus').textContent=e}}
refresh();setInterval(refresh,30000)</script></body></html>
