services:
  - type: web
    name: sg-transport-pulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LTA_ACCOUNT_KEY
        sync: false
      - key: TIMETABLE_TOKEN      # optional but recommended: protects planned-timetable upload/clear
        sync: false
      - key: BUNCHING_ADMIN_TOKEN # optional: protects Bunching settings / Service Headway Master edits (falls back to TIMETABLE_TOKEN)
        sync: false
      - key: BUNCHING_SERVICES    # optional: default watch list, e.g. 32,145,65
        sync: false
