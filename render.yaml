services:
  - type: web
    name: sg-transport-pulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LTA_ACCOUNT_KEY
        sync: false
      - key: TIMETABLE_TOKEN      # optional but recommended: protects planned-timetable upload/clear
        sync: false
      - key: BUNCHING_ADMIN_TOKEN # optional: protects Bunching settings / Service Headway Master edits (falls back to TIMETABLE_TOKEN)
        sync: false
      - key: BUNCHING_SERVICES    # optional: default watch list, e.g. 32,145,65
        sync: false
      - key: BUNCHING_ALWAYS_ON   # optional: 1 = keep collecting when nobody has the page open (needed for an unattended event log; uses more LTA quota)
        sync: false
      - key: OVERPASS_URL         # optional: road-restriction data for the off-service route check (default public overpass-api.de)
        sync: false
